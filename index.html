<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">
<meta name="description" content="JG Digital — Marketing, Design e Estratégia.">
<title>JG Digital | Links</title>
<style>
:root {
  --bg:#050505;
  --card:rgba(18,18,18,.82);
  --gold:#c9a66b;
  --gold2:#f0d6a0;
  --text:#f7f3eb;
  --muted:#aaa39a;
  --line:rgba(201,166,107,.32);
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; color:var(--text);
  font-family:Arial, Helvetica, sans-serif;
  background:
    radial-gradient(circle at 50% 0%, rgba(201,166,107,.13), transparent 32%),
    radial-gradient(circle at 10% 90%, rgba(201,166,107,.06), transparent 28%),
    var(--bg);
  display:flex; justify-content:center; padding:28px 16px 40px;
}
.wrap{width:100%;max-width:480px;text-align:center}
.logo{
  width:150px;height:150px;object-fit:contain;border-radius:50%;
  margin:0 auto 15px; display:block;
  filter:drop-shadow(0 0 18px rgba(201,166,107,.15));
}
.brand{font-size:26px;letter-spacing:7px;font-weight:700;margin:0 0 5px;text-shadow:0 0 18px rgba(201,166,107,.14)}
.tag{color:var(--muted);font-size:11px;letter-spacing:3px;text-transform:uppercase;margin-bottom:25px}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:22px;
  padding:16px; backdrop-filter:blur(12px);
  box-shadow:0 18px 50px rgba(0,0,0,.35);
}
.section-title{font-size:11px;letter-spacing:2.4px;text-transform:uppercase;color:var(--gold2);margin:7px 0 11px;font-weight:700}
a.btn{
  display:flex; align-items:center; justify-content:center; gap:10px;
  width:100%; min-height:54px; margin:10px 0; padding:14px 18px;
  border-radius:13px; text-decoration:none; color:var(--text);
  border:1px solid rgba(255,255,255,.10); background:#111;
  font-size:15px; font-weight:600; transition:.2s ease;
}
a.btn:hover{transform:translateY(-2px);border-color:var(--gold);box-shadow:0 8px 22px rgba(201,166,107,.12)}
a.whatsapp{background:linear-gradient(135deg,#b9904d,#d7b87d);color:#090909;border-color:transparent}
.icon{font-size:19px;width:24px;display:inline-flex;align-items:center;justify-content:center}.instagram-icon svg{width:21px;height:21px}
.divider{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);margin:18px 0}
.note{font-size:12px;color:var(--muted);line-height:1.5;margin:14px 4px 3px}
.footer{font-size:10px;color:#777;letter-spacing:2px;margin-top:22px}
.small{font-weight:400;color:#d8d0c3}
@media(max-width:380px){.brand{font-size:22px;letter-spacing:5px}.logo{width:130px;height:130px}}
</style>
</head>
